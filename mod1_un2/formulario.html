<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>

<body>
    <h1>Datos personales</h1>
    <h2>Completar el siguiente formulario</h2>
    <form action="">
        <p>
            <label for="Nombre">Nombre</label>
            <input type="text" id="Nombre" name="Nombre">
        </p>
        <p>
            <label for="Apellido">Apellido</label>
            <input type="text" id="Apellido" name="Apellido">
        </p>
        <p>
            <label for="Nacionalidad">Nacionalidad</label>
            <input type="text" id="Nacionalidad" name="Nacionalidad">
        </p>
        <p>
            <label for="Edad">Edad</label>
            <input type="text" id="Edad" name="Edad">
        </p>
        <p>
            <label for="Sexo">Sexo</label>
        <ul>
            <li><input type="radio" id="Masculino" name="Sexo" value="Masculino"><label
                    for="Masculino">Masculino</label></li>
            <li><input type="radio" id="Femenino" name="Sexo" value="Femenino"><label for="Femenino">Femenino</label>
            </li>
            <li><input type="radio" id="No binario" name="Sexo" value="No binario"><label for="No binario">No
                    binario</label></li>
        </ul>
        </p>
        <p>
            <label for="Idiomas">Idiomas que conoce:</label>
        <ul>

            <li><input type="checkbox" id="Inglés" name="Idiomas" value="Inglés"><label for="Inglés">Inglés</label></li>
            <li><input type="checkbox" id="Francés" name="Idiomas" value="Francés"><label for="Francés">Francés</label>
            </li>
            <li><input type="checkbox" id="Alemán" name="Idiomas" value="Alemán"><label for="Alemán">Alemán</label></li>
            <li><input type="checkbox" id="Italiano" name="Idiomas" value="Italiano"><label
                    for="Italiano">Italiano</label></li>
            <li><input type="checkbox" id="Portugués" name="Idiomas" value="Portugués"><label
                    for="Portugués">Portugués</label></li>
            <li>Otro (Detalle cuál): <input type="text" id="Otro" name="Otro"></li>
        </ul>
        </p>
        <p>
            <label for="Información adicional">Agregue aquí información adicional que crea importante:</label>
        </p>
        <p><textarea name="Información adicional" id="Información adicional" cols="80" rows="10"></textarea>
        </p>
        <p><input type="submit" value="Enviar"></p>
    </form>
</body>

</html>
